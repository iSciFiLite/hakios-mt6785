# Realme 6 (RMX2001), codename NEMO.

device nemo
	title       Realme 6 (RMX2001, Nemo)
	vendor      realme
	soc         mt6785
	defconfig   nemo_defconfig
	maintainer  HakiOS MT6785 port contributors
	status      display     partial   Local device-tree reference reports a 1080x2400 Truly panel; boot framebuffer handoff is unverified
	status      touch       missing   Local reference names Novatek NT36672C; no HakiOS controller driver is enabled
	status      buttons     missing   MTK PMIC/keypad path not ported for this board
	status      cpu         partial   MT6785 topology recorded; donor loader affinity and SMP handoff not ported
	status      gpu         missing   Mali-G76 is identified; donor Mali-G52 driver is not enabled
	status      storage     missing   UFS is present; MTK loader does not yet publish the kernel UFS handoff page
	status      audio       missing   no MT6785 audio path
	status      battery     missing   no MT6785 PMIC/battery path
	status      wifi        missing   no MT6785 CONNSYS path
	status      bluetooth   missing   no MT6785 CONNSYS path
	status      camera      missing   no camera path
	status      haptic      missing   no haptic path
	status      thermal     missing   no MT6785 thermal path
